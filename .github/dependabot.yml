version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    groups:
      compatible:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      compatible:
        patterns: ["*"]
  - package-ecosystem: pip
    open-pull-requests-limit: 0
    directory: /.ci
    schedule:
      interval: weekly

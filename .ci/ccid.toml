schema = 1
project = "csrh"

# Preserved hosted Linux gates live here;
# resolve/cargo-update excluded per prior-cohort rule;
# registry/live reads stay FRESH outside cache.
[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["wasm-pack", "--version"], ["chromedriver", "--version"], ["chromium", "--version"], ["clang", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "wasm-coverage.json", "wasm-coverage.lcov", "wasm-coverage.txt"]

[render]
tool_revision = "81ebac8e86e20bc93b69d5e912bbcb0c0d036d58"

[jobs.verify]
scheduler = "crow"
checks = ["verify"]
workflow = "repository-jobs"
command = ["bash", ".ci/run-cached.sh"]
